<!doctype html>
<html><head><meta charset="utf-8"><title>Preview</title>
<script>
// Sandboxed page: renders AI-generated HTML (pages, mind maps, flashcards, apps) with scripts enabled,
// isolated from the extension and its storage.
window.addEventListener("message", e => {
  if (!e.data || typeof e.data.html !== "string") return;
  document.open(); document.write(e.data.html); document.close();
});
parent.postMessage({ sandboxReady: true }, "*");
</script></head><body></body></html>
