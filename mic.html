<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Allow microphone</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="js/mic.js" defer></script>
</head>
<body class="chat-page">
  <main class="chat-page-main">
    <div class="card gate">
      <div class="gate-avatar">🎤</div>
      <h3>Allow microphone for FlowPrint</h3>
      <p class="muted">Chrome only asks for microphone access in a normal tab. Click the button and choose <b>Allow</b>. Then close this tab and use the 🎤 button again.</p>
      <button id="allow" class="btn primary block">Allow microphone</button>
      <div id="st" class="status"></div>
    </div>
  </main>
</body>
</html>
